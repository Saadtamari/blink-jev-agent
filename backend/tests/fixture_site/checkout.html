<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SkyFind - checkout</title>
<style>body{font-family:Arial,sans-serif;padding:40px;background:#f3f6fb} label{display:block;margin:12px 0} input{font-size:18px;padding:8px} button{font-size:18px;padding:12px 28px;background:#0b7a3e;color:#fff;border:0;border-radius:6px}</style>
</head>
<body>
  <h1>Checkout</h1>
  <p>Enter your payment details to complete the booking.</p>
  <label>Card number <input id="card" placeholder="1234 5678 9012 3456"></label>
  <label>CVV <input id="cvv" placeholder="123"></label>
  <label>Billing address <input id="addr"></label>
  <button id="pay">Pay now</button>
</body>
</html>
