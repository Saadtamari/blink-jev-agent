# 20 benchmark tasks. "check" = simple success test on the final answer:
#   min_rows: table rows with at least one number
#   keywords: words that must appear in the summary / notes / table (case-insensitive, any one of each group)
- id: trip_japan
  goal: I want to go to Japan for 7 days in March from Cairo. How much will it cost?
  check: {min_rows: 3, keywords: [[flight], [hotel, accommodation], [visa]]}
- id: trip_paris
  goal: How much does a 5 day trip to Paris from London cost in April?
  check: {min_rows: 2, keywords: [[flight, train, eurostar], [hotel, accommodation]]}
- id: trip_istanbul
